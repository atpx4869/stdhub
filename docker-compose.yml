version: "3.8"

services:
  stdhub:
    image: jzrm/stdhub:latest
    container_name: stdhub
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - stdhub-data:/app/data
      - stdhub-standards:/app/standards
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      NODE_ENV: production
      PORT: 3000
      STDHUB_BIND_HOST: 0.0.0.0
      # 容器必须监听 0.0.0.0，默认端口只映射到宿主机 loopback。
      # 局域网/公网直连前务必改成真实 STDHUB_PROXY_TOKEN，并删除下一行。
      STDHUB_ALLOW_OPEN_ADMIN: "1"
volumes:
  stdhub-data:
  stdhub-standards:
