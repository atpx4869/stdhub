version: "3.8"

services:
  stdhub:
    image: jzrm/stdhub:latest
    container_name: stdhub
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - stdhub-data:/app/data
      - stdhub-standards:/app/standards
    restart: unless-stopped
    cpus: "1.50"
    mem_limit: 1536m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
    # Compose 在宿主机读取凭据并注入环境变量；不要把本文件 bind mount 到
    # /app/.env.local，非 root 容器用户无法保证读取宿主机上的私有文件权限。
    # .env.local 需与本文件同目录；required: false（未创建时也能启动）需要
    # Docker Compose ≥ 2.24，旧版本请删除 required 并先创建 .env.local。
    # 镜像内本身不含 .env.local，因此无需再设 STDHUB_SKIP_DOTENV_LOCAL。
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      STDHUB_BIND_HOST: 0.0.0.0
      # 容器必须监听 0.0.0.0，默认端口只映射到宿主机 loopback。
      # 局域网/公网直连前务必改成真实 STDHUB_PROXY_TOKEN，并删除下一行。
      STDHUB_ALLOW_OPEN_ADMIN: "1"
      # PDF 图片预览默认单任务转换，避免占满低功耗 NAS。
      STDHUB_PREVIEW_CONCURRENCY: "1"
      STDHUB_PREVIEW_WIDTH: "1800"
      STDHUB_PREVIEW_QUALITY: "88"
      STDHUB_PREVIEW_TIMEOUT_MS: "120000"
      STDHUB_PREVIEW_MIN_FREE_MB: "256"
volumes:
  stdhub-data:
  stdhub-standards:
