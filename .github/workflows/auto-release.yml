name: Auto Release (bump version on every push)

# 每次 push 到 main（或手动触发）→ 自动递增 patch 版本号 → commit + tag → push。
# 推送后由现有工作流接力：
#   - release.yml（push tags v*）        → 创建 GitHub Release
#   - docker-publish.yml（push main）    → 构建并发布新版本 Docker 镜像
# 防循环：bump commit 的 message 以 "chore: bump version to" 开头，
# 本工作流对这类提交直接跳过（release.yml / docker-publish.yml 不受影响）。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # gh workflow run 触发 CI/CD 需要

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip version-bump commits
        id: check
        shell: bash
        run: |
          MSG="$(git log -1 --format=%s)"
          if [[ "$MSG" == "chore: bump version to"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync with latest main
        if: steps.check.outputs.skip == 'false'
        run: git pull --rebase origin main

      - name: Bump patch version
        id: bump
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          NEXT="$(node scripts/bump-version.mjs)"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: v$NEXT"

      - name: Commit, tag and push
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin HEAD:main "refs/tags/v${VERSION}"
          echo "Pushed v${VERSION} to main + tag"

      # 注：GITHUB_TOKEN 推送的 commit/tag 不会触发 release.yml / docker-publish.yml
      # （GitHub 规则：GITHUB_TOKEN 产生的事件不创建新 workflow run，workflow_dispatch 除外），
      # 所以 Release 创建与 Docker 构建必须在这里显式完成。
      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          gh release create "v${VERSION}" --title "StdHub v${VERSION}" --generate-notes \
            || gh release edit "v${VERSION}" --title "StdHub v${VERSION}" --notes "StdHub v${VERSION}"

      - name: Trigger Docker build & publish for new version
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run "docker-publish.yml" --ref main
          echo "Triggered CI/CD (docker-publish) for main"
