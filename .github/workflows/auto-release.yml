name: Release (manual version bump)

# 仅由维护者手动触发。候选代码必须先通过构建、单元测试、Chromium E2E、
# 容器启动冒烟和 HIGH/CRITICAL 镜像扫描，之后才允许 bump、tag 和 Release。

on:
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # gh workflow run 触发 CI/CD 需要

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run css:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build candidate image
        run: docker build -t stdhub-release-candidate .
      - name: Smoke test candidate image
        shell: bash
        run: |
          docker run -d --name stdhub-release-smoke -e STDHUB_BIND_HOST=0.0.0.0 -e STDHUB_ALLOW_OPEN_ADMIN=1 -p 127.0.0.1:3000:3000 stdhub-release-candidate
          trap 'docker logs stdhub-release-smoke; docker rm -f stdhub-release-smoke' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          exit 1
      - name: Block HIGH and CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stdhub-release-candidate
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          version: v0.73.0

  bump-and-release:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          NEXT="$(node scripts/bump-version.mjs)"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: v$NEXT"

      - name: Commit, tag and push
        shell: bash
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin HEAD:main "refs/tags/v${VERSION}"
          echo "Pushed v${VERSION} to main + tag"

      # GITHUB_TOKEN 推送不会产生新的 workflow run，因此显式创建 Release 并派发镜像发布。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          gh release create "v${VERSION}" --title "StdHub v${VERSION}" --generate-notes \
            || gh release edit "v${VERSION}" --title "StdHub v${VERSION}" --notes "StdHub v${VERSION}"

      - name: Trigger Docker build & publish for new version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run "docker-publish.yml" --ref main
          echo "Triggered CI/CD (docker-publish) for main"
