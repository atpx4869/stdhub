name: Create GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "StdHub $GITHUB_REF_NAME" --generate-notes || gh release edit "$GITHUB_REF_NAME" --title "StdHub $GITHUB_REF_NAME"
