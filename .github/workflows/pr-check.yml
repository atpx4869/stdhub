name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Check CSS entrypoints
        run: npm run css:check

      - name: Run tests
        run: npm test

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run Chromium smoke tests
        run: npm run test:e2e
