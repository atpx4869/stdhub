name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Check CSS entrypoints
        run: npm run css:check

      - name: Run tests
        run: npm test

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run Chromium smoke tests
        run: npm run test:e2e

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  sca:
    name: Dependency & Source Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          version: v0.73.0

      - name: Upload Trivy filesystem results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif

  docker:
    name: Docker Scan & Publish
    runs-on: ubuntu-latest
    needs: [build-test, codeql, sca]
    # push（每次提交）：门禁通过后构建并推送「提交 SHA」标签镜像，可按提交拉取验证；
    #   但绝不写 latest/版本号标签，避免与发布构建竞态覆盖 latest。
    # workflow_dispatch（由 auto-release 在 bump 版本后触发）：
    #   此时 package.json 已是 bump 后的新版本，是唯一的 latest/版本号标签写入者。
    # pull_request：不构建（fork PR 无 secrets 权限，也没有发布语义）。
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 按事件计算镜像标签：dispatch（发布）= SHA + latest + 裸版本 + v 前缀版本；
      # push = 仅 SHA。latest/版本号始终只有发布流程能写。
      - name: Compute image tags and labels
        id: meta
        shell: bash
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/stdhub
          EVENT: ${{ github.event_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SHA="$(git rev-parse --short=7 HEAD)"
          {
            echo "tags<<TAGS_EOF"
            echo "${IMAGE}:${SHA}"
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "${IMAGE}:latest"
              echo "${IMAGE}:${VERSION}"
              echo "${IMAGE}:v${VERSION}"
            fi
            echo "TAGS_EOF"
            echo "labels<<LABELS_EOF"
            echo "org.opencontainers.image.title=StdHub"
            echo "org.opencontainers.image.version=${VERSION}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "LABELS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Pick scan tag
        id: scan-tag
        shell: bash
        run: |
          FIRST_TAG="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)"
          echo "value=$FIRST_TAG" >> "$GITHUB_OUTPUT"

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.scan-tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test built image
        shell: bash
        run: |
          docker run -d --name stdhub-smoke -e STDHUB_BIND_HOST=0.0.0.0 -e STDHUB_ALLOW_OPEN_ADMIN=1 -p 127.0.0.1:3000:3000 "${{ steps.scan-tag.outputs.value }}"
          trap 'docker logs stdhub-smoke; docker rm -f stdhub-smoke' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          exit 1

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scan-tag.outputs.value }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          version: v0.73.0

      - name: Upload Trivy image results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.scan-tag.outputs.value }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: stdhub-sbom
          path: sbom.spdx.json

      - name: Push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest
        env:
          IMAGE_REF: ${{ secrets.DOCKERHUB_USERNAME }}/stdhub@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"
